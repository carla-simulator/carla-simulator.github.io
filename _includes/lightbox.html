{% comment %}
Styles for slideshow.html, and a lightbox: clicking an image with the class `zoomable` opens it full size.
Include once per post: {% include lightbox.html %}
{% endcomment %}
<style>
  .post-slideshow { margin: 1.5rem 0; }
  .post-slideshow .carousel-indicators { bottom: 2.4rem; }
  .post-slideshow .carousel-control-prev,
  .post-slideshow .carousel-control-next { bottom: 2rem; width: 10%; }
  .post-slideshow .carousel-item img { aspect-ratio: 16 / 9; object-fit: contain; background: #000; }
  .post-slideshow-caption { font-size: 0.85rem; color: #6c757d; text-align: center; padding: 0.5rem 0 0.4rem; min-height: 2rem; }
  img.zoomable { cursor: zoom-in; }
  .post-video { display: block; width: 100%; border-radius: 0.25rem; background: #000; margin-top: 1.5rem; }
  .post-video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.8rem; margin-top: 1.5rem; }
  .post-video-grid .post-video { margin-top: 0; aspect-ratio: 16 / 9; object-fit: cover; }
  @media (max-width: 576px) { .post-video-grid { grid-template-columns: 1fr; } }
  .post-assets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin: 1.5rem 0 0.5rem; }
  @media (max-width: 576px) { .post-assets { grid-template-columns: 1fr; } }
  .post-assets a { display: block; border: 1px solid #dee2e6; border-radius: .4rem; overflow: hidden; color: inherit; text-decoration: none; }
  .post-assets a:hover { border-color: #0085a1; box-shadow: 0 2px 8px rgba(0,0,0,.08); text-decoration: none; }
  .post-assets img { display: block; width: 100%; aspect-ratio: 1; }
  .post-assets span { display: block; padding: 0.5rem 0.7rem; font-size: 0.9rem; line-height: 1.3; }
  .post-assets b { color: #0085a1; }
  table td:first-child { white-space: nowrap; }
  table td:first-child a { color: #0085a1; text-decoration: underline; }
  .post-maps { grid-template-columns: repeat(4, 1fr); margin-bottom: 0.8rem; }
  .post-maps img { aspect-ratio: 4 / 3; }
  @media (max-width: 768px) { .post-maps { grid-template-columns: 1fr 1fr; } }
  .post-community { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin: 1.5rem 0; }
  @media (max-width: 576px) { .post-community { grid-template-columns: 1fr; } }
  .post-community a { display: flex; align-items: center; gap: 0.9rem; padding: 0.9rem 1rem; border: 1px solid #dee2e6;
    border-radius: 0.4rem; color: inherit; text-decoration: none !important; transition: border-color .15s, box-shadow .15s; }
  .post-community a:hover { border-color: #0085a1; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .post-community .fa-2x, .post-community svg { width: 2rem; color: #0085a1; flex: none; }
  .post-community b { display: block; color: #0085a1; }
  .post-community span { font-size: 0.9rem; line-height: 1.35; }
  #lightbox .modal-dialog { max-width: 95vw; width: fit-content; margin: 2.5vh auto; }
  #lightbox .modal-content { background: transparent; border: 0; }
  #lightbox img { max-width: 100%; max-height: 90vh; margin: 0 auto; display: block; cursor: zoom-out; }
  #lightbox .lightbox-caption { color: #fff; text-align: center; padding-top: 0.5rem; font-size: 0.9rem; }
  #lightbox .lightbox-counter { position: fixed; top: 1rem; right: 1.5rem; color: #ccc; font-size: 0.85rem; }
  #lightbox .lightbox-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 3rem; height: 5rem; border: 0;
    border-radius: 4px; background: rgba(255,255,255,.12); color: #fff; font-size: 2.6rem; line-height: 1; cursor: pointer; z-index: 1060; }
  #lightbox .lightbox-nav:hover { background: rgba(255,255,255,.25); }
  #lightbox .lightbox-nav.prev { left: 1rem; }
  #lightbox .lightbox-nav.next { right: 1rem; }
</style>

<div class="modal fade" id="lightbox" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <img src="" alt="" data-dismiss="modal">
      <div class="lightbox-caption"></div>
    </div>
    <div class="lightbox-counter"></div>
    <button type="button" class="lightbox-nav prev" aria-label="Previous image">&#8249;</button>
    <button type="button" class="lightbox-nav next" aria-label="Next image">&#8250;</button>
  </div>
</div>

<script>
  // Click to enlarge. While enlarged, the mouse wheel, the arrow keys, the side buttons or a swipe move through the
  // other images of the same slideshow (or, for a single image, through the post's other single images).
  document.addEventListener('DOMContentLoaded', function () {
    var gallery = [], current = 0, carousel = null, wheelLock = 0, touchX = null;
    function captionOf(img) { return $(img).siblings('.post-slideshow-caption').text() || img.alt; }
    function show(i) {
      current = (i + gallery.length) % gallery.length;
      var img = gallery[current];
      $('#lightbox img').attr('src', img.src).attr('alt', img.alt);
      $('#lightbox .lightbox-caption').text(captionOf(img));
      $('#lightbox .lightbox-counter').text(gallery.length > 1 ? (current + 1) + ' / ' + gallery.length : '');
      $('#lightbox .lightbox-nav').toggle(gallery.length > 1);
      if (carousel) carousel.carousel(current);
    }
    $(document).on('click', 'img.zoomable', function () {
      var c = $(this).closest('.carousel');
      carousel = c.length ? c : null;
      gallery = carousel ? carousel.find('.carousel-item img').toArray()
                         : $('img.zoomable').filter(function () { return !$(this).closest('.carousel').length; }).toArray();
      if (carousel) carousel.carousel('pause');
      show(gallery.indexOf(this));
      $('#lightbox').modal('show');
    });
    $('#lightbox .lightbox-nav').on('click', function (e) { e.stopPropagation(); show(current + ($(this).hasClass('next') ? 1 : -1)); });
    $(document).on('keydown', function (e) {
      if (!$('#lightbox').hasClass('show')) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); show(current + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); show(current - 1); }
    });
    document.getElementById('lightbox').addEventListener('wheel', function (e) {
      e.preventDefault();
      var now = Date.now();                       // one step per trackpad gesture
      if (now - wheelLock < 350 || Math.abs(e.deltaY) < 4) return;
      wheelLock = now; show(current + (e.deltaY > 0 ? 1 : -1));
    }, { passive: false });
    document.getElementById('lightbox').addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
    document.getElementById('lightbox').addEventListener('touchend', function (e) {
      if (touchX === null) return;
      var dx = e.changedTouches[0].clientX - touchX; touchX = null;
      if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
    });
    $('#lightbox').on('hidden.bs.modal', function () { $('.post-slideshow').carousel('cycle'); });
  });
</script>
